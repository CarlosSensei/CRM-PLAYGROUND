<header class="header">

  <div class="search-container">

    <input class="search-input"
      type="text"
      [(ngModel)]="searchText"
      placeholder="Buscar..."
      (input)="onSearch()">

      <button
        class="add-button"
        [ngClass]="currentSection"
        [title]="currentSection === 'clients'
            ? 'Nuevo Cliente': currentSection === 'quotes'
            ? 'Nuevo Presupuesto': currentSection === 'orders' 
            ? 'Nuevo Pedido': 'error'"
        (click)="onAdd()">
        ✚
      </button>

  </div>

</header>
