<div class="modal-backdrop">

  <div class="modal">

    <h2>Editar Pedido</h2>

    <div class="order-number">
      {{ order.orderNumber }}
    </div>

    <div class="form-group">
      <label>Estado</label>

      <select [(ngModel)]="order.status">

        <option value="Pending">Pendiente</option>
        <option value="InProduction">En Producción</option>
        <option value="Ready">Listo</option>
        <option value="Delivered">Entregado</option>
        <option value="Cancelled">Cancelado</option>

      </select>
    </div>

    <div class="form-group">
      <label>Total</label>

      <input
        type="number"
        [(ngModel)]="order.totalAmount">
    </div>

    <div class="total">
      Total Pedido: {{ order.totalAmount }} €
    </div>

    <div class="actions">

      <button (click)="save()">
        Guardar
      </button>

      <button (click)="cancel()">
        Cancelar
      </button>

    </div>

  </div>

</div>
