<div class="modal-backdrop" (click)="closeModal()">

  <div class="modal-content" (click)="$event.stopPropagation()">

    <div class="modal-header">

      <h2>Editar Cliente</h2>

      <button
        class="close-btn"
        (click)="closeModal()">
        ✖
      </button>

    </div>

    <div class="form-grid">

        <div class="form-group">
        <label>Nombre</label>
        <input
            type="text"
            [(ngModel)]="client.name">
        </div>

        <div class="form-group">
        <label>Apellido</label>
        <input
            type="text"
            [(ngModel)]="client.firstName">
        </div>

        <div class="form-group">
        <label>Segundo Apellido</label>
        <input
            type="text"
            [(ngModel)]="client.lastName">
        </div>

        <div class="form-group">
        <label>Teléfono</label>
        <input
            type="text"
            [(ngModel)]="client.phone">
        </div>

        <div class="form-group">
        <label>Email</label>
        <input
            type="email"
            [(ngModel)]="client.email">
        </div>

        <div class="form-group">
        <label>DNI</label>
        <input
            type="text"
            [(ngModel)]="client.dni">
        </div>

        <div class="form-group">
        <label>Ciudad</label>
        <input
            type="text"
            [(ngModel)]="client.city">
        </div>

    </div>

    <div class="actions">

      <button
        class="btn-cancel"
        (click)="closeModal()">
        Cancelar
      </button>

      <button
        class="btn-save"
        (click)="saveClient()">
        Guardar
      </button>

    </div>

  </div>

</div>
