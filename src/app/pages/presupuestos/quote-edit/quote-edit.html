<div class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <h2 *ngIf="quote?.id && quote.id > 0">Editar presupuesto</h2>
      <h2 *ngIf="!quote?.id || quote.id === 0">Nuevo presupuesto</h2>

      <button class="close-btn" (click)="cancel()">✖</button>
    </div>

    <span class="quote-number">{{ quote.id }}</span>

    <div class="form-group">
      <label>Estado</label>

      <select [(ngModel)]="quote.status">

        <option value="Draft">Draft</option>
        <option value="Sent">Sent</option>
        <option value="Accepted">Accepted</option>
        <option value="Rejected">Rejected</option>
        <option value="Expired">Expired</option>

      </select>

    </div>

    <div class="form-group">
      <label>Notas</label>

      <textarea rows="4" [(ngModel)]="quote.notes"></textarea>

    </div>

    <div class="total">Total: {{ quote.totalAmount }} €</div>

    <div class="actions">

      <button class="btn-cancel" (click)="cancel()">
        Cancelar
      </button>

      <button class="btn-save" (click)="save()">
        Guardar
      </button>

    </div>

  </div>

</div>
